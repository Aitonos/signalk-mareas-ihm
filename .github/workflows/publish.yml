# GitHub Actions workflow: publish signalk-mareas-ihm to NPM automatically
# when a git tag matching vX.Y.Z is pushed.
#
# Auth model: Trusted Publishing via OIDC (no long-lived NPM token).
# GitHub Actions signs a short-lived JWT identifying this workflow;
# NPM validates it against the "trusted publishers" list registered on
# the package page and issues a ~15-minute publish token. Nothing to
# rotate, nothing to leak.
#
# One-time setup (already done, kept for reference):
#   1. On npmjs.com → package signalk-mareas-ihm → Access → Trusted
#      publishers → Add:
#        Publisher:  GitHub Actions
#        Owner:      Aitonos
#        Repository: signalk-mareas-ihm
#        Workflow:   publish.yml
#        Environment: (empty)
#   2. Push a version tag: `git tag vX.Y.Z && git push origin vX.Y.Z`
#      The workflow runs, verifies the tag matches package.json version,
#      builds, and publishes with provenance attestation.
#
# Replaces the previous NPM_TOKEN model (Rev 2.11.6). That model failed
# in production because the package's 2FA policy required an OTP on
# every publish, and classic automation tokens could not bypass it.
# Trusted Publishing sidesteps 2FA entirely with per-run OIDC exchange.

name: Publish to NPM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # id-token: write is required so GH Actions can mint the OIDC JWT
    # that npm publish exchanges for a short-lived registry token.
    # contents: read is default but declared explicitly for clarity.
    permissions:
      id-token: write
      contents: read
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a Trusted-Publishing-capable version
        # Trusted Publishing requires npm CLI >= 11.5.1. Node 22 LTS
        # ships with npm 10.x, so we upgrade explicitly. Removing this
        # step would resurface EOTP failures on publish.
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi

      - name: Install dependencies
        # `npm install` en vez de `npm ci` porque este proyecto NO commitea
        # package-lock.json (ver .gitignore: "this project does not commit
        # package-lock.json"). npm ci requiere lock, npm install no.
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to NPM (with provenance)
        # --provenance emits a signed attestation linking the published
        # tarball to this specific workflow run and git commit. It shows
        # as a "verified provenance" badge on the npm package page and
        # gives downstream users a supply-chain integrity check.
        # No NODE_AUTH_TOKEN env: OIDC auth is picked up automatically
        # by npm 11.5.1+ when running inside a GH Actions job with
        # id-token: write and a matching trusted publisher on npmjs.
        run: npm publish --access public --provenance
