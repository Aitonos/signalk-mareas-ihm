# GitHub Actions workflow: publish signalk-mareas-ihm to NPM automatically
# when a git tag matching vX.Y.Z is pushed.
#
# One-time setup by the maintainer:
#   1. Generate an NPM automation token: https://www.npmjs.com/settings/<user>/tokens
#      Type: "Automation" (bypasses 2FA, safe for CI)
#      Scope: read-write, packages: signalk-mareas-ihm
#   2. In the GitHub repo: Settings → Secrets and variables → Actions → New
#      repository secret:
#        Name:  NPM_TOKEN
#        Value: <the token from step 1>
#   3. Push a version tag: `git tag v2.11.6 && git push origin v2.11.6`
#      The workflow runs on the tag push, verifies the tag matches
#      package.json version, builds, and publishes.
#
# If the secret NPM_TOKEN is missing, the workflow fails safely without
# publishing anything.

name: Publish to NPM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Verify NPM_TOKEN secret is present
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret not configured in repo Settings → Secrets. See .github/workflows/publish.yml comments for one-time setup instructions."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json before tagging."
            exit 1
          fi

      - name: Install dependencies
        # `npm install` en vez de `npm ci` porque este proyecto NO commitea
        # package-lock.json (ver .gitignore: "this project does not commit
        # package-lock.json"). npm ci requiere lock, npm install no.
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
